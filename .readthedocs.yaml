# Read the Docs configuration file
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

# The package itself is not installed: eccodes, pyfesom2 and cartopy are heavy
# or need system libraries, and conf.py mocks them for autodoc instead.
python:
  install:
    - requirements: docs/requirements.txt
