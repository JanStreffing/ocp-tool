name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - awi-hpc/pgierz/feat/ci
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      
      - name: Generate changelog
        id: changelog
        run: |
          # Generate changelog from git commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          cat > CHANGELOG.md << EOF
          # Changes in ${{ steps.get_version.outputs.version }}
          
          ${CHANGES}
          
          ## Full Changelog
          
          See [commits](https://github.com/${{ github.repository }}/compare/${LAST_TAG}...${{ steps.get_version.outputs.version }}) for full details.
          EOF
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          release_name: Release ${{ steps.get_version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}

  build-release-containers:
    name: Build Release Containers
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        target: [production, development]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      
      - name: Build and push release image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: workflow/containers/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  build-singularity-release:
    name: Build Singularity Release
    needs: create-release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Singularity
        uses: eWaterCycle/setup-singularity@v7
        with:
          singularity-version: 3.11.4
      
      - name: Build Singularity container
        run: |
          sudo singularity build ocp-tool-${{ needs.create-release.outputs.version }}.sif workflow/containers/singularity.def
      
      - name: Upload Singularity image to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./ocp-tool-${{ needs.create-release.outputs.version }}.sif
          asset_name: ocp-tool-${{ needs.create-release.outputs.version }}.sif
          asset_content_type: application/octet-stream

  upload-workflow-assets:
    name: Upload Workflow Assets
    needs: create-release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create workflow archive
        run: |
          tar -czf ocp-tool-workflow-${{ needs.create-release.outputs.version }}.tar.gz \
            workflow/ \
            environment.yaml \
            README.md \
            --exclude='workflow/logs' \
            --exclude='workflow/temp'
      
      - name: Upload workflow archive to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./ocp-tool-workflow-${{ needs.create-release.outputs.version }}.tar.gz
          asset_name: ocp-tool-workflow-${{ needs.create-release.outputs.version }}.tar.gz
          asset_content_type: application/gzip

  notify-release:
    name: Notify Release
    needs: [create-release, build-release-containers, build-singularity-release]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Create release summary
        run: |
          cat > $GITHUB_STEP_SUMMARY << EOF
          # 🚀 Release ${{ needs.create-release.outputs.version }} Complete
          
          ## 📦 Available Assets
          
          - **Docker Images**: \`ghcr.io/${{ github.repository }}:${{ needs.create-release.outputs.version }}-production\`
          - **Development Image**: \`ghcr.io/${{ github.repository }}:${{ needs.create-release.outputs.version }}-development\`  
          - **Singularity Container**: \`ocp-tool-${{ needs.create-release.outputs.version }}.sif\`
          - **Workflow Archive**: \`ocp-tool-workflow-${{ needs.create-release.outputs.version }}.tar.gz\`
          
          ## 🐳 Quick Start with Docker
          
          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}:${{ needs.create-release.outputs.version }}-production
          docker run --rm -v \$(pwd):/app/data ghcr.io/${{ github.repository }}:${{ needs.create-release.outputs.version }}-production snakemake --cores 4
          \`\`\`
          
          ## 📖 Documentation
          
          Visit the [documentation](https://${{ github.repository_owner }}.github.io/ocp-tool/) for usage guides and API reference.
          EOF