# OCP-Tool Configuration
# OpenIFS Coupling Preparation Tool
# Configuration: TCO95 L91 + CORE3 without ice cavities
#
# TCO95_CORE3.yaml against the core3_nocav mesh. The ASCII mesh files are
# byte-identical to core3; only namelist.config differs (use_cavity=.false.),
# so the 10038 cavity nodes become open ocean in the OpenIFS mask.
# mesh.nc does not exist yet and is built from the ASCII files by pyfesom2.

# Atmosphere grid settings
atmosphere:
  resolution_list: [95]
  truncation_type: "cubic-octahedral"
  experiment_name: "ab45"  # ICMGGab45INIT is the TCO95L91 file

# Ocean grid settings
ocean:
  grid_name: "CORE3_nocav"
  has_ice_cavities: false
  mesh_file: "/work/ab0246/a270092/input/fesom2/core3_nocav/mesh.nc"

# Basin modifications for runoff
runoff:
  manual_basin_removal:
    - "caspian-sea"

# Put the pristine lake cover back at flipped cells, so the Caspian and the
# Great Lakes are FLake lakes rather than soil. Off by default because it
# changes published files; this grid has none.
lakes:
  restore_flipped_lakes: true

# Paths (relative to auto-detected root_dir, or absolute)
# Output dirs auto-computed as: output/TCO95_CORE3_nocav/
paths:
  input:
    fesom_mesh: "input/fesom_mesh/"
    gaussian_grids_full: "input/gaussian_grids_full/"
    gaussian_grids_octahedral_reduced: "input/gaussian_grids_octahedral_reduced/"
    gaussian_grids_linear_reduced: "input/gaussian_grids_linear_reduced/"
    openifs_default: "input/openifs_input_default/"
    runoff_default: "input/runoff_map_default/"
    lpj_guess: "input/lpj-guess/"

# Processing options
options:
  verbose: true
  parallel_workers: 4
  use_dask: true
  # No published predecessor for this grid, so no _v2 suffix.
  output_suffix: ""
